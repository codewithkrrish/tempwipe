[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tempwipe"
version = "1.0.0"
description = "Report reclaimable space in temp dirs and app caches, and clean them only when you say so"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Krrish", email = "codewithkrrish7@gmail.com" }]

[project.scripts]
tempwipe = "tempwipe.cli:main"

[tool.setuptools.packages.find]
include = ["tempwipe*"]
